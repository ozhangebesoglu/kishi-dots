font_family BigBlueTermPlus Nerd Font 
font_size 14


disable_ligatures no
enable_audio_bell no

shell 		  zsh
shell_integration disabled

cursor_shape block

url_style curly

remember_window_size no
initial_window_width 640
inital_window_height 480
window_padding_width 100
cursor_blink_interval 0

background_opacity	      0.80
scrollbar_handle_opacity      0
scrollbar_track_opacity       0
scrollbar_track_hover_opacity 0
confirm_os_window_close       0


sync_to_monitor no


#Colors below
background #403838
foreground #fff1f3

cursor #fff1f3
cursor_text_color #000000
selection_foreground #403838
selection_background #fff1f3

