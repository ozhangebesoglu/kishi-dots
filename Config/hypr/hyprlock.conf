# --- Dosyaları Dahil Et ---
source = ~/.config/hypr/hyprlock/colors.conf

# --- Genel Ayarlar ---
general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

# --- Arka Plan ---
background {
    monitor =
    path = screenshot
    color = $entry_background_color
    blur_passes = 3 # Bulanıklığı biraz artırdık (Daha şık durur)
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# --- Profil Resmi (Image Widget) ---
image {
    monitor =
    # Senin koyduğun doğru yol:
    path = /home/ozhan/.config/face.png 
    size = 120
    rounding = -1 # Tam yuvarlak yapar
    border_size = 4
    border_color = $entry_border_color
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 1
}

# --- Saat ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $text_color
    font_size = 90
    font_family = $font_family_clock
    position = 0, 20
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 4
}

# --- Tarih ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = $text_color
    font_size = 18
    font_family = $font_family
    position = 0, -40
    halign = center
    valign = center
}


# --- Müzik Bilgisi (Yeni Widget) ---
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/hyprlock/song-status.sh
    color = $entry_border_color # Şarkı ismi vurgulu (turuncu) olsun
    font_size = 16
    font_family = $font_family
    position = 0, -80
    halign = center
    valign = center
}

# --- Şifre Giriş Kutusu ---
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $text_color
    fade_on_empty = false
    placeholder_text = <span foreground="##ebdbb2">$USER</span><span foreground="##d79921">@archlinux</span> <span foreground="##ebdbb2">~ $</span>
    hide_input = false
    position = 0, -150
    halign = center
    valign = center
}

# --- Alt Bilgi Çubuğu (Pil ve CapsLock) ---
# Pil Durumu
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/hyprlock/status.sh
    color = $text_color
    font_size = 14
    font_family = $font_family
    position = -30, 30
    halign = right
    valign = bottom
}

# Caps Lock Uyarısı
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/hyprlock/check-capslock.sh
    color = rgba(204, 36, 29, 1.0) # Kırmızı uyarı rengi
    font_size = 14
    font_family = $font_family
    position = 0, 30
    halign = center
    valign = bottom
}

# --- Klavye Düzeni ---
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/hyprlock/layout.sh
    color = $entry_border_color # Vurgulu renk (Turuncu)
    font_size = 14
    font_family = $font_family
    position = 30, -30
    halign = left
    valign = top
}

# --- Uptime ---
label {
    monitor =
    text = cmd[update:60000] echo "Uptime: $(uptime -p | sed 's/up //')"
    color = $text_color
    font_size = 12
    font_family = $font_family
    position = -30, 60
    halign = right
    valign = bottom
}
# --- Söz ---
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/hyprlock/quote.sh
    color = $entry_border_color # Vurgulu renk olsun
    font_size = 12
    font_family = $font_family_clock # İtalik vs destekliyorsa güzel durur
    position = 0, 80
    halign = center
    valign = bottom
}
# --- Selamlama ---
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/hyprlock/greeting.sh
    color = $text_color
    font_size = 20
    font_family = $font_family
    position = 0, 100
    halign = center
    valign = center
}

# --- Arch Logo ---
label {
    monitor =
    text = cmd[update:0] ~/.config/hypr/hyprlock/arch-ascii.sh
    color = rgba(255, 255, 255, 0.09) # Çok silik (%5 opaklık)
    font_size = 20
    font_family = JetBrainsMono Nerd Font Mono # Mono olması şart!
    position = 0, 0
    halign = center
    valign = center
    zindex = -1
}
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/hyprlock/active-window.sh
    color = rgba(255, 255, 255, 0.6) # Biraz silik olsun
    font_size = 12
    font_family = $font_family
    position = 0, -400 # Şifre kutusunun (input-field) biraz üstü
    halign = center
    valign = center
}
